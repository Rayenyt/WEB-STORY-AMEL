<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Vision Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
    background: radial-gradient(circle at top,#ff006e,#0a0015 60%,#000);
    transition:.5s;
}

/* LIGHT MODE */
body.light{
    background: radial-gradient(circle at top,#ffb3d1,#ffe6f1 60%,#fff);
    color:#111;
}

/* BACKGROUND */
.bg{
    position:absolute;
    inset:0;
}

.bg span{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    animation:float linear infinite;
}

@keyframes float{
    from{transform:translateY(100vh);}
    to{transform:translateY(-100vh);}
}

/* TOP BUTTON */
.toggle{
    position:absolute;
    top:20px;
    right:20px;
    z-index:10;
    padding:10px 18px;
    border:none;
    border-radius:20px;
    cursor:pointer;
    background:linear-gradient(45deg,#ff006e,#8338ec);
    color:white;
    font-weight:600;
}

/* MAIN */
.container{
    position:relative;
    z-index:5;
    display:flex;
    gap:60px;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
}

/* CARD */
.card{
    width:320px;
    height:430px;
    border-radius:30px;
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.15);
    text-align:center;
    overflow:hidden;
    transition:.4s;
    box-shadow:0 0 40px rgba(255,0,120,.2);
}

body.light .card{
    background:rgba(255,255,255,0.8);
}

.card:hover{
    transform:translateY(-10px) scale(1.02);
}

/* HEADER */
.header{
    height:150px;
    background:linear-gradient(135deg,#ff006e,#8338ec);
}

/* IMAGE */
.card img{
    width:150px;
    height:150px;
    border-radius:50%;
    object-fit:cover;
    margin-top:-75px;
    border:5px solid rgba(255,255,255,.3);
    cursor:pointer;
}

/* TEXT */
.card h2{
    margin-top:15px;
    font-size:28px;
}

.card p{
    font-size:14px;
    opacity:.85;
    margin-top:10px;
    padding:0 15px;
}

.badge{
    display:inline-block;
    margin-top:15px;
    padding:10px 20px;
    border-radius:30px;
    background:linear-gradient(45deg,#ff006e,#ff4da6);
}

/* CENTER */
.center{
    text-align:center;
}

.center .heart{
    font-size:130px;
    animation:pulse 1.5s infinite;
    text-shadow:0 0 40px #ff2d75;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.25);}
    100%{transform:scale(1);}
}

.center h1{
    font-family:'Great Vibes',cursive;
    font-size:60px;
    color:#ff9ad5;
}

/* IMAGE MODAL */
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:20;
}

.modal img{
    width:80%;
    max-width:400px;
    border-radius:20px;
}

/* HEARTS CLICK */
.heart-float{
    position:absolute;
    font-size:20px;
    animation:up 1s linear forwards;
}

@keyframes up{
    from{transform:translateY(0);opacity:1;}
    to{transform:translateY(-100px);opacity:0;}
}

</style>
</head>

<body>

<button class="toggle" onclick="toggleMode()">Toggle Mode 🌗</button>

<div class="bg" id="bg"></div>

<div class="container">

    <!-- YOU -->
    <div class="card">
        <div class="header"></div>
        <img src="https://files.catbox.moe/gpncs4.jpg" onclick="openImg(this.src)">
        <h2>Rayen</h2>
        <p>My heart sees only one direction: love.</p>
        <div class="badge">Forever Mine ❤</div>
    </div>

    <!-- CENTER -->
    <div class="center">
        <div class="heart" onclick="heartClick(event)">❤</div>
        <h1>Alma</h1>
        <p>Two Hearts • One Vision</p>
    </div>

    <!-- HER -->
    <div class="card">
        <div class="header"></div>
        <img src="https://files.catbox.moe/kwlmq4.jpg" onclick="openImg(this.src)">
        <h2>Alma</h2>
        <p>The light that makes my world visible.</p>
        <div class="badge">Soul Mate ✨</div>
    </div>

</div>

<!-- MODAL -->
<div class="modal" id="modal" onclick="closeImg()">
    <img id="modalImg">
</div>

<script>

/* STARS */
const bg=document.getElementById("bg");

for(let i=0;i<120;i++){
    let s=document.createElement("span");
    s.style.left=Math.random()*100+"%";
    s.style.animationDuration=(Math.random()*8+4)+"s";
    bg.appendChild(s);
}

/* MODE */
function toggleMode(){
    document.body.classList.toggle("light");
}

/* IMAGE ZOOM */
function openImg(src){
    document.getElementById("modal").style.display="flex";
    document.getElementById("modalImg").src=src;
}

function closeImg(){
    document.getElementById("modal").style.display="none";
}

/* HEART CLICK EFFECT */
function heartClick(e){
    let h=document.createElement("div");
    h.className="heart-float";
    h.innerHTML="❤";
    h.style.left=e.clientX+"px";
    h.style.top=e.clientY+"px";
    document.body.appendChild(h);

    setTimeout(()=>h.remove(),1000);
}

</script>

</body>
</html>
