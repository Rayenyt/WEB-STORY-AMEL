<!DOCTYPE html><html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love Story</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }body {
  min-height: 100vh;
  overflow: hidden;
  background: radial-gradient(circle at top, #3b003b 0%, #120014 35%, #09000d 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
}

body::before {
  content: "";
  position: absolute;
  width: 900px;
  height: 900px;
  background: radial-gradient(circle, rgba(255,0,128,0.25), transparent 70%);
  filter: blur(80px);
  animation: ambientGlow 8s ease-in-out infinite alternate;
  z-index: 0;
}

body::after {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    45deg,
    rgba(255,255,255,0.015) 0px,
    rgba(255,255,255,0.015) 2px,
    transparent 2px,
    transparent 12px
  );
  pointer-events: none;
  z-index: 0;
}

@keyframes ambientGlow {
  from {
    transform: translateY(-20px) scale(1);
    opacity: 0.7;
  }
  to {
    transform: translateY(20px) scale(1.15);
    opacity: 1;
  }
}
  min-height: 100vh;
  overflow: hidden;
  background: linear-gradient(135deg, #120014, #2d002f, #59003b);
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
}

.background {
  position: absolute;
  width: 100%;
  height: 100%;
  overflow: hidden;
  z-index: 0;
}

.floating-heart {
  position: absolute;
  color: rgba(255,255,255,0.15);
  animation: floatUp linear infinite;
  user-select: none;
}

@keyframes floatUp {
  0% {
    transform: translateY(100vh) scale(0.5);
    opacity: 0;
  }
  10% {
    opacity: 1;
  }
  100% {
    transform: translateY(-120vh) scale(1.2);
    opacity: 0;
  }
}

.container {
  position: relative;
  z-index: 2;
  display: flex;
  gap: 120px;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.heart-wrapper {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
}

.center-love {
  position: relative;
  width: 220px;
  height: 220px;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

.center-love h3 {
  color: white;
  font-size: 26px;
  letter-spacing: 2px;
  z-index: 2;
  text-shadow: 0 0 20px #ff66b3;
  animation: glowText 2s infinite alternate;
}

.ring {
  position: absolute;
  width: 180px;
  height: 180px;
  border: 3px solid rgba(255,255,255,0.3);
  border-radius: 50%;
  animation: rotateRing 10s linear infinite;
  box-shadow: 0 0 30px rgba(255, 105, 180, 0.5);
}

.ring2 {
  width: 230px;
  height: 230px;
  animation-direction: reverse;
  animation-duration: 15s;
}

@keyframes rotateRing {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}

@keyframes glowText {
  from {
    text-shadow: 0 0 10px #ff66b3;
  }
  to {
    text-shadow: 0 0 25px white;
  }
}
  position: relative;
  z-index: 2;
  display: flex;
  gap: 90px;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.heart-card {
  position: relative;
  width: 320px;
  height: 320px;
  transform: rotate(-45deg);
  background: linear-gradient(145deg, #ff0f7b, #ff4d9d);
  box-shadow: 0 0 40px rgba(255, 0, 111, 0.7), inset 0 0 20px rgba(255,255,255,0.2);
  border-radius: 35px;
  animation: pulse 2.5s infinite;
  transition: 0.4s ease;
  backdrop-filter: blur(10px);
  border: 2px solid rgba(255,255,255,0.15);
}

.second-heart {
  background: linear-gradient(145deg, #7b2ff7, #f107a3);
}
  position: relative;
  width: 280px;
  height: 280px;
  transform: rotate(-45deg);
  background: linear-gradient(145deg, #ff0f7b, #ff4d9d);
  box-shadow: 0 0 40px rgba(255, 0, 111, 0.7);
  border-radius: 30px;
  animation: pulse 2.5s infinite;
  transition: 0.4s ease;
}

.heart-card:hover {
  transform: rotate(-45deg) scale(1.08);
  box-shadow:
    0 0 40px rgba(255, 0, 111, 0.9),
    0 0 80px rgba(255, 77, 157, 0.8),
    0 0 120px rgba(255,255,255,0.3);
  filter: brightness(1.08);
}

.heart-card::before,
.heart-card::after {
  box-shadow:
    inset 0 0 35px rgba(255,255,255,0.15),
    0 0 30px rgba(255, 77, 157, 0.5);
}

.heart-card::selection {
  background: transparent;
}

.heart-card::marker {
  display: none;
}
  transform: rotate(-45deg) scale(1.08);
  box-shadow: 0 0 60px rgba(255, 0, 111, 0.9);
}

.heart-card::before,
.heart-card::after {
  content: "";
  position: absolute;
  width: 280px;
  height: 280px;
  background: linear-gradient(145deg, #ff0f7b, #ff4d9d);
  border-radius: 50%;
}

.heart-card::before {
  top: -140px;
  left: 0;
}

.heart-card::after {
  left: 140px;
  top: 0;
}

@keyframes pulse {
  0%,100% {
    transform: rotate(-45deg) scale(1);
  }
  50% {
    transform: rotate(-45deg) scale(1.05);
  }
}

.heart-content {
  position: absolute;
  inset: 0;
  transform: rotate(45deg);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 5;
  text-align: center;
  padding: 20px;
}

.heart-content img {
  width: 160px;
  height: 160px;
  object-fit: cover;
  border-radius: 50%;
  border: 5px solid rgba(255,255,255,0.9);
  box-shadow:
    0 0 25px rgba(255,255,255,0.6),
    0 0 60px rgba(255,0,128,0.5),
    inset 0 0 20px rgba(255,255,255,0.4);
  margin-bottom: 15px;
  transition: 0.4s;
  position: relative;
  overflow: hidden;
}

.heart-content img::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,0.4), transparent);
  animation: shine 3s infinite;
}

@keyframes shine {
  0% {
    transform: translateX(-100%);
  }
  100% {
    transform: translateX(200%);
  }
}
  width: 150px;
  height: 150px;
  object-fit: cover;
  border-radius: 50%;
  border: 5px solid white;
  box-shadow: 0 0 25px rgba(255,255,255,0.6);
  margin-bottom: 15px;
  transition: 0.4s;
}

.heart-content img:hover {
  transform: scale(1.08);
}

.heart-content h2 {
  color: white;
  font-size: 30px;
  font-weight: 700;
  text-shadow: 0 0 12px rgba(255,255,255,0.8);
  margin-bottom: 8px;
}

.tag {
  padding: 8px 18px;
  border-radius: 30px;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.3);
  color: white;
  font-size: 14px;
  backdrop-filter: blur(10px);
  box-shadow: 0 0 15px rgba(255,255,255,0.2);
}
  color: white;
  font-size: 28px;
  font-weight: 700;
  text-shadow: 0 0 12px rgba(255,255,255,0.8);
}

.upload-panel {
  position: absolute;
  top: 25px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  justify-content: center;
}

.upload-panel label {
  padding: 14px 24px;
  border-radius: 18px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.2);
  color: white;
  cursor: pointer;
  backdrop-filter: blur(12px);
  box-shadow: 0 0 25px rgba(255,0,128,0.25);
  transition: 0.3s ease;
  font-size: 14px;
  font-weight: 600;
}

.upload-panel label:hover {
  transform: translateY(-3px) scale(1.03);
  box-shadow: 0 0 35px rgba(255,0,128,0.45);
}

.upload-panel input {
  display: none;
}

.love-text {
  position: absolute;
  bottom: 40px;
  text-align: center;
  color: white;
  z-index: 3;
  width: 100%;
  padding: 0 20px;
}

.love-text h1 {
  font-size: 56px;
  margin-bottom: 10px;
  background: linear-gradient(90deg, #ff9ad5, #ffffff, #ff4d9d, #ffb3e6);
  background-size: 300% 300%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: glow 2s infinite alternate, gradientMove 6s ease infinite;
  letter-spacing: 2px;
}

@keyframes gradientMove {
  0% {
    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
  100% {
    background-position: 0% 50%;
  }
}
  font-size: 48px;
  margin-bottom: 10px;
  background: linear-gradient(90deg, #ff9ad5, #ffffff, #ff4d9d);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: glow 2s infinite alternate;
}

.love-text p {
  font-size: 18px;
  color: #ffd6eb;
  letter-spacing: 1px;
}

@keyframes glow {
  from {
    filter: drop-shadow(0 0 10px #ff4d9d);
  }
  to {
    filter: drop-shadow(0 0 20px #ffffff);
  }
}

@media(max-width: 768px) {
  body {
    overflow-y: auto;
  }

  .container {
    flex-direction: column;
    gap: 120px;
    margin-top: 80px;
  }

  .love-text h1 {
    font-size: 34px;
  }

  .love-text p {
    font-size: 15px;
  }
}

  </style>
</head>
<body>  <div class="background" id="background"></div>  <div class="container"><div class="heart-wrapper">
  <div class="heart-card">
    <div class="heart-content">
      <img src="PUT_YOUR_IMAGE_LINK_HERE" alt="Your Photo">
      <h2>Your Name</h2>
      <span class="tag">My Heart</span>
    </div>
  </div>
</div>

<div class="center-love">
  <div class="ring"></div>
  <div class="ring ring2"></div>
  <h3>Love Forever</h3>
</div>

<div class="heart-wrapper">
  <div class="heart-card second-heart">
    <div class="heart-content">
      <img src="PUT_HER_IMAGE_LINK_HERE" alt="Her Photo">
      <h2>Alma</h2>
      <span class="tag">Soul Mate</span>
    </div>
  </div>
</div>

  </div>  <div class="love-text">
    <h1>Forever Love ❤</h1>
    <p>Two hearts, one soul, endless love.</p>
  </div><div class="upload-panel">
<label>
  Upload Your Photo
  <input type="file" id="yourPhoto" accept="image/*">
</label>

<label>
  Upload Alma Photo
  <input type="file" id="almaPhoto" accept="image/*">
</label>

  </div>  <script>
    const background = document.getElementById('background');

    const yourPhotoInput = document.getElementById('yourPhoto');
    const almaPhotoInput = document.getElementById('almaPhoto');

    const images = document.querySelectorAll('.heart-content img');

    yourPhotoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if(file){
        images[0].src = URL.createObjectURL(file);
      }
    });

    almaPhotoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if(file){
        images[1].src = URL.createObjectURL(file);
      }
    });

    for (let i = 0; i < 60; i++) {
      const sparkle = document.createElement('div');
      sparkle.style.position = 'absolute';
      sparkle.style.width = '3px';
      sparkle.style.height = '3px';
      sparkle.style.borderRadius = '50%';
      sparkle.style.background = 'white';
      sparkle.style.left = Math.random() * 100 + 'vw';
      sparkle.style.top = Math.random() * 100 + 'vh';
      sparkle.style.boxShadow = '0 0 15px white';
      sparkle.style.animation = `spark ${Math.random() * 3 + 2}s infinite alternate`;
      background.appendChild(sparkle);
    }

    const style = document.createElement('style');
    style.innerHTML = `
      @keyframes spark {
        from {
          opacity: 0.2;
          transform: scale(0.8);
        }
        to {
          opacity: 1;
          transform: scale(1.6);
        }
      }
    `;
    document.head.appendChild(style);

    for (let i = 0; i < 40; i++) {
      const heart = document.createElement('div');
      heart.classList.add('floating-heart');
      heart.innerHTML = '❤';

      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = (Math.random() * 25 + 15) + 'px';
      heart.style.animationDuration = (Math.random() * 8 + 5) + 's';
      heart.style.animationDelay = Math.random() * 5 + 's';

      background.appendChild(heart);
    }
  </script></body>
</html>
