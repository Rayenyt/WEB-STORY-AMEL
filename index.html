<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luxury Love Page</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    overflow:hidden;
    background:
    radial-gradient(circle at top left,#ff006e 0%,transparent 25%),
    radial-gradient(circle at bottom right,#8338ec 0%,transparent 25%),
    linear-gradient(135deg,#05010d,#12001f,#1b002c);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
    position:relative;
}

/* Animated Background */
.bg{
    position:absolute;
    inset:0;
    overflow:hidden;
}

.bg span{
    position:absolute;
    width:4px;
    height:4px;
    background:white;
    border-radius:50%;
    opacity:.5;
    animation:stars linear infinite;
}

@keyframes stars{
    from{
        transform:translateY(100vh);
    }
    to{
        transform:translateY(-100vh);
    }
}

/* MAIN */
.main{
    position:relative;
    z-index:5;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:50px;
    flex-wrap:wrap;
    margin-top:20px;
}

/* LOVE CARD */
.love-card{
    width:320px;
    height:430px;
    border-radius:35px;
    position:relative;
    overflow:hidden;
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.12);
    box-shadow:
    0 0 40px rgba(255,0,128,.25),
    inset 0 0 25px rgba(255,255,255,.05);
    transition:.5s;
}

.love-card:hover{
    transform:translateY(-12px) scale(1.02);
    box-shadow:
    0 0 70px rgba(255,0,128,.55);
}

.top-gradient{
    position:absolute;
    width:100%;
    height:170px;
    background:linear-gradient(135deg,#ff006e,#8338ec);
}

.profile{
    position:relative;
    z-index:2;
    display:flex;
    justify-content:center;
    margin-top:80px;
}

.profile img{
    width:170px;
    height:170px;
    border-radius:50%;
    object-fit:cover;
    border:6px solid rgba(255,255,255,.18);
    box-shadow:0 0 35px rgba(255,0,120,.6);
}

.info{
    text-align:center;
    margin-top:20px;
    padding:0 20px;
}

.info h2{
    font-size:32px;
    font-weight:700;
}

.info p{
    margin-top:10px;
    opacity:.8;
    font-size:15px;
    line-height:1.7;
}

.badge{
    display:inline-block;
    margin-top:18px;
    padding:10px 24px;
    border-radius:50px;
    background:linear-gradient(45deg,#ff006e,#ff4da6);
    font-weight:600;
    box-shadow:0 0 20px rgba(255,0,128,.5);
}

/* CENTER HEART */
.center-box{
    position:relative;
    width:260px;
    height:260px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.glow{
    position:absolute;
    width:180px;
    height:180px;
    border-radius:50%;
    background:rgba(255,0,128,.2);
    filter:blur(50px);
}

.heart{
    font-size:120px;
    animation:pulse 1.8s infinite;
    text-shadow:0 0 30px rgba(255,0,128,.9);
}

@keyframes pulse{
    0%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.15);
    }
    100%{
        transform:scale(1);
    }
}

.love-text{
    position:absolute;
    bottom:15px;
    text-align:center;
}

.love-text h1{
    font-family:'Great Vibes',cursive;
    font-size:55px;
    color:#ff9ad5;
}

.love-text p{
    font-size:15px;
    opacity:.85;
}

/* CONTROL PANEL */
.panel{
    position:relative;
    z-index:5;
    width:90%;
    max-width:850px;
    margin-top:40px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(18px);
    border-radius:30px;
    padding:30px;
    box-shadow:0 0 30px rgba(255,0,128,.2);
}

.panel h3{
    text-align:center;
    font-size:30px;
    margin-bottom:25px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.input-box{
    display:flex;
    flex-direction:column;
}

.input-box label{
    margin-bottom:10px;
    font-size:14px;
    opacity:.85;
}

.input-box input{
    padding:16px;
    border:none;
    outline:none;
    border-radius:16px;
    background:rgba(255,255,255,.08);
    color:white;
    font-size:15px;
}

.input-box input::placeholder{
    color:#ccc;
}

.btn{
    width:100%;
    margin-top:25px;
    padding:18px;
    border:none;
    border-radius:18px;
    background:linear-gradient(45deg,#ff006e,#8338ec);
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:.4s;
}

.btn:hover{
    transform:scale(1.02);
    box-shadow:0 0 30px rgba(255,0,128,.5);
}

@media(max-width:950px){

    body{
        overflow:auto;
        padding:40px 0;
    }

    .main{
        flex-direction:column;
    }

    .grid{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<!-- STARS -->
<div class="bg" id="bg"></div>

<div class="main">

    <!-- YOUR CARD -->
    <div class="love-card">

        <div class="top-gradient"></div>

        <div class="profile">
            <img id="yourImg"
            src="https://i.imgur.com/8Km9tLL.jpg">
        </div>

        <div class="info">
            <h2 id="yourName">Your Name</h2>

            <p>
                A beautiful soul filled with love,
                happiness and unforgettable memories.
            </p>

            <span class="badge">Forever Mine ❤</span>
        </div>

    </div>

    <!-- CENTER -->
    <div class="center-box">

        <div class="glow"></div>

        <div class="heart">❤</div>

        <div class="love-text">
            <h1>Alma</h1>
            <p>Two Hearts • One Soul</p>
        </div>

    </div>

    <!-- ALMA CARD -->
    <div class="love-card">

        <div class="top-gradient"></div>

        <div class="profile">
            <img id="almaImg"
            src="https://i.imgur.com/QIrZWGIs.jpg">
        </div>

        <div class="info">
            <h2>Alma</h2>

            <p>
                The queen of my heart,
                my happiness and my forever love.
            </p>

            <span class="badge">Soul Mate ✨</span>
        </div>

    </div>

</div>

<!-- CONTROL PANEL -->
<div class="panel">

    <h3>Customize Love Page ✨</h3>

    <div class="grid">

        <div class="input-box">
            <label>Your Name</label>

            <input
            type="text"
            id="nameInput"
            placeholder="Enter your name">
        </div>

        <div class="input-box">
            <label>Your Image Link</label>

            <input
            type="text"
            id="yourLink"
            placeholder="Paste your image link">
        </div>

        <div class="input-box">
            <label>Alma Image Link</label>

            <input
            type="text"
            id="almaLink"
            placeholder="Paste Alma image link">
        </div>

        <div class="input-box">
            <label>Custom Love Text</label>

            <input
            type="text"
            id="loveText"
            placeholder="Example: Forever Together">
        </div>

    </div>

    <button class="btn" onclick="updatePage()">
        Update Love Page ❤
    </button>

</div>

<script>

/* STARS */
const bg = document.getElementById("bg");

for(let i=0;i<120;i++){

    const star = document.createElement("span");

    star.style.left = Math.random()*100+"%";

    star.style.top = Math.random()*100+"%";

    star.style.animationDuration =
    (Math.random()*10+5)+"s";

    star.style.opacity = Math.random();

    bg.appendChild(star);
}

/* UPDATE PAGE */
function updatePage(){

    const name =
    document.getElementById("nameInput").value;

    const yourLink =
    document.getElementById("https://ibb.co/Gv03htxn").value;

    const almaLink =
    document.getElementById("https://ibb.co/bMCRd9pC").value;

    const loveText =
    document.getElementById("Forever Together ❤").value;

    if(name){
        document.getElementById("RAYEN").innerText =
        name;
    }

    if(yourLink){
        document.getElementById("yourImg").src =
        yourLink;
    }

    if(almaLink){
        document.getElementById("almaImg").src =
        almaLink;
    }

    if(loveText){
        document.querySelector(".love-text p").innerText =
        loveText;
    }
}

</script>

</body>
</html>
