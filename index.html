<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Vision Pro+ 💖 | Ultra Edition</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* =========================
   BODY
========================= */

body{
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    color:white;
    background:radial-gradient(circle at top,#ff006e,#0a0015 60%,#000);
    padding-bottom:80px;
    transition:.4s;
}

/* LIGHT MODE */
body.light{
    background:radial-gradient(circle at top,#ffd1e8,#fff 60%,#f7f7f7);
    color:#111;
}

/* =========================
   BACKGROUND ANIMATION
========================= */

.bg{
    position:fixed;
    inset:0;
    z-index:0;
}

.bg span{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    animation:float linear infinite;
    opacity:.7;
}

@keyframes float{
    from{transform:translateY(100vh);}
    to{transform:translateY(-100vh);}
}

/* =========================
   TOP BAR
========================= */

.top-bar{
    position:fixed;
    top:15px;
    right:15px;
    z-index:100;
    display:flex;
    gap:10px;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:15px;
    cursor:pointer;
    font-weight:600;
    background:linear-gradient(45deg,#ff006e,#8338ec);
    color:white;
    transition:.3s;
    box-shadow:0 0 20px rgba(255,0,110,.4);
}

button:hover{
    transform:scale(1.05);
}

/* =========================
   MAIN LAYOUT
========================= */

.container{
    position:relative;
    z-index:5;
    display:flex;
    gap:60px;
    flex-wrap:wrap;
    justify-content:center;
    margin-top:120px;
}

/* =========================
   CARD DESIGN
========================= */

.card{
    width:320px;
    height:430px;
    border-radius:30px;
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.15);
    text-align:center;
    overflow:hidden;
    transition:.4s;
    box-shadow:0 0 30px rgba(255,0,110,.15);
}

.card:hover{
    transform:translateY(-10px) scale(1.02);
}

.card img{
    width:150px;
    height:150px;
    border-radius:50%;
    object-fit:cover;
    margin-top:-75px;
    border:5px solid rgba(255,255,255,.3);
    cursor:pointer;
    filter:blur(6px);
    transition:.4s;
}

.card img:hover{
    filter:blur(0px);
    transform:scale(1.07);
}

/* =========================
   CENTER HEART
========================= */

.center{
    text-align:center;
}

.center .heart{
    font-size:130px;
    animation:pulse 1.5s infinite;
    cursor:pointer;
    text-shadow:0 0 40px #ff2d75;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.25);}
    100%{transform:scale(1);}
}

.center h1{
    font-family:'Great Vibes',cursive;
    font-size:60px;
    color:#ff9ad5;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.92);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999;
}

.modal img{
    width:80%;
    max-width:450px;
    border-radius:20px;
}

/* =========================
   HEART EFFECT
========================= */

.heart-float{
    position:absolute;
    font-size:20px;
    animation:up 1s linear forwards;
    pointer-events:none;
}

@keyframes up{
    from{transform:translateY(0);opacity:1;}
    to{transform:translateY(-150px);opacity:0;}
}

/* =========================
   MESSAGES SYSTEM
========================= */

.section{
    width:90%;
    max-width:900px;
    margin-top:60px;
    text-align:center;
    z-index:5;
}

.box{
    background:rgba(255,255,255,0.06);
    padding:20px;
    border-radius:20px;
    backdrop-filter:blur(15px);
}

input,textarea{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:none;
    border-radius:15px;
    background:rgba(255,255,255,0.1);
    color:white;
}

/* =========================
   IMAGE GALLERY (NEW BIG SYSTEM)
========================= */

.images-section{
    width:90%;
    max-width:1100px;
    margin-top:70px;
    text-align:center;
}

.upload-box{
    margin-top:20px;
    padding:20px;
    background:rgba(255,255,255,0.06);
    border-radius:20px;
}

.images-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:15px;
    margin-top:20px;
}

/* IMAGE CARD */
.img-box{
    border-radius:20px;
    overflow:hidden;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 0 20px rgba(255,0,110,.25);
}

.img-box:hover{
    transform:scale(1.05);
}

.img-box img{
    width:100%;
    height:170px;
    object-fit:cover;
    filter:blur(10px);
    transition:.4s;
}

.img-box:hover img{
    filter:blur(0px);
}

/* =========================
   EXTRA SECTION: LOVE QUOTES
========================= */

.quotes{
    margin-top:60px;
    text-align:center;
}

.quote-box{
    margin-top:20px;
    padding:20px;
    border-radius:20px;
    background:rgba(255,255,255,0.05);
}

/* =========================
   SETTINGS PANEL
========================= */

.settings{
    position:fixed;
    bottom:20px;
    right:20px;
    z-index:999;
}

.panel{
    display:none;
    padding:15px;
    background:rgba(0,0,0,0.7);
    border-radius:15px;
}

</style>
</head>

<body>

<!-- TOP BAR -->
<div class="top-bar">
<button onclick="toggleMode()">🌗 Mode</button>
<button onclick="toggleMusic()">🎵 Music</button>
<button onclick="toggleSettings()">⚙</button>
</div>

<div class="bg" id="bg"></div>

<!-- MAIN -->
<div class="container">

<div class="card">
<img src="https://files.catbox.moe/gpncs4.jpg" onclick="openImg(this.src)">
<h2>Rayen</h2>
<p>My heart sees only one direction: love.</p>
</div>

<div class="center">
<div class="heart" onclick="heartClick(event)">❤</div>
<h1>Alma</h1>
</div>

<div class="card">
<img src="https://files.catbox.moe/kwlmq4.jpg" onclick="openImg(this.src)">
<h2>Alma</h2>
<p>The light that makes my world visible.</p>
</div>

</div>

<!-- MESSAGES -->
<div class="section">
<h2>💌 Messages</h2>

<div class="box">
<input id="title" placeholder="title">
<textarea id="text" placeholder="message"></textarea>
<button onclick="addMsg()">Add</button>
</div>

<div id="messages"></div>
</div>

<!-- IMAGES -->
<div class="images-section">
<h2>📸 Hidden Memories</h2>

<div class="upload-box">
<input id="imgUrl" placeholder="image url">
<button onclick="addImage()">Add Image</button>
</div>

<div class="images-grid" id="images"></div>
</div>

<!-- QUOTES -->
<div class="quotes">
<h2>💖 Love Quotes</h2>
<div class="quote-box" id="quoteBox">Click for love quote</div>
<button onclick="newQuote()">New Quote</button>
</div>

<!-- MODAL -->
<div class="modal" id="modal" onclick="closeImg()">
<img id="modalImg">
</div>

<!-- SETTINGS -->
<div class="settings">
<div class="panel" id="panel">
<p>Settings Panel</p>
</div>
</div>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
"https://vjsphepnycchogektxcq.supabase.co",
"sb_publishable_TzMnSWGJWmQF190_x9Fxfg_2tbr1gnX"
);

/* BG */
const bg=document.getElementById("bg");
for(let i=0;i<200;i++){
let s=document.createElement("span");
s.style.left=Math.random()*100+"%";
s.style.animationDuration=(Math.random()*10+5)+"s";
bg.appendChild(s);
}

/* MODE */
window.toggleMode=()=>document.body.classList.toggle("light");

/* MUSIC */
let music=new Audio("https://files.catbox.moe/vfkb97.mp3");
let play=false;
window.toggleMusic=()=>{
play=!play;
play?music.play():music.pause();
}

/* MODAL */
window.openImg=(src)=>{
document.getElementById("modal").style.display="flex";
document.getElementById("modalImg").src=src;
}
window.closeImg=()=>document.getElementById("modal").style.display="none";

/* HEART */
window.heartClick=(e)=>{
let h=document.createElement("div");
h.className="heart-float";
h.innerHTML="❤";
h.style.left=e.clientX+"px";
h.style.top=e.clientY+"px";
document.body.appendChild(h);
setTimeout(()=>h.remove(),1000);
}

/* SETTINGS */
window.toggleSettings=()=>{
let p=document.getElementById("panel");
p.style.display=p.style.display==="block"?"none":"block";
}

/* QUOTES */
let quotes=[
"Love is not what you say, it's what you do.",
"You are my favorite notification.",
"One heart, two souls.",
];

window.newQuote=()=>{
document.getElementById("quoteBox").innerText=
quotes[Math.floor(Math.random()*quotes.length)];
}

</script>

</body>
</html>
