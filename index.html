<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Vision Pro+ 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
    background: radial-gradient(circle at top,#ff006e,#0a0015 60%,#000);
}

/* LIGHT MODE */
body.light{
    background: radial-gradient(circle at top,#ffd1e8,#fff 60%,#f7f7f7);
    color:#111;
}

/* BACKGROUND */
.bg{
    position:fixed;
    inset:0;
    z-index:0;
}

.bg span{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    animation:float linear infinite;
}

@keyframes float{
    from{transform:translateY(100vh);}
    to{transform:translateY(-100vh);}
}

/* BUTTONS */
.top-bar{
    position:fixed;
    top:15px;
    right:15px;
    z-index:20;
    display:flex;
    gap:10px;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:15px;
    cursor:pointer;
    font-weight:600;
    background:linear-gradient(45deg,#ff006e,#8338ec);
    color:white;
}

/* MAIN */
.container{
    position:relative;
    z-index:5;
    display:flex;
    gap:60px;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    margin-top:80px;
}

/* CARD */
.card{
    width:320px;
    height:430px;
    border-radius:30px;
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.15);
    text-align:center;
    overflow:hidden;
    transition:.4s;
}

.card:hover{
    transform:translateY(-10px) scale(1.02);
}

.header{
    height:150px;
    background:linear-gradient(135deg,#ff006e,#8338ec);
}

.card img{
    width:150px;
    height:150px;
    border-radius:50%;
    object-fit:cover;
    margin-top:-75px;
    border:5px solid rgba(255,255,255,.3);
    cursor:pointer;
}

.card h2{
    margin-top:15px;
    font-size:28px;
}

.card p{
    font-size:14px;
    opacity:.85;
    margin-top:10px;
    padding:0 15px;
}

.badge{
    display:inline-block;
    margin-top:15px;
    padding:10px 20px;
    border-radius:30px;
    background:linear-gradient(45deg,#ff006e,#ff4da6);
}

/* CENTER */
.center{
    text-align:center;
}

.center .heart{
    font-size:130px;
    animation:pulse 1.5s infinite;
    text-shadow:0 0 40px #ff2d75;
    cursor:pointer;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.25);}
    100%{transform:scale(1);}
}

.center h1{
    font-family:'Great Vibes',cursive;
    font-size:60px;
    color:#ff9ad5;
}

/* MODAL */
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:50;
}

.modal img{
    width:80%;
    max-width:420px;
    border-radius:20px;
}

/* HEART EFFECT */
.heart-float{
    position:absolute;
    font-size:20px;
    animation:up 1s linear forwards;
}

@keyframes up{
    from{transform:translateY(0);opacity:1;}
    to{transform:translateY(-120px);opacity:0;}
}

/* MESSAGES */
.section{
    width:90%;
    max-width:900px;
    margin-top:60px;
    text-align:center;
}

.box{
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(15px);
    padding:20px;
    border-radius:25px;
}

input,textarea{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:none;
    border-radius:15px;
    background:rgba(255,255,255,0.1);
    color:white;
    outline:none;
}

textarea{
    height:90px;
    resize:none;
}

.msg{
    margin-top:15px;
    padding:15px;
    border-radius:20px;
    background:rgba(255,255,255,0.08);
    border-left:4px solid #ff006e;
    text-align:left;
    position:relative;
}

.copy{
    position:absolute;
    right:10px;
    top:10px;
    font-size:12px;
    cursor:pointer;
    opacity:.7;
}

.copy:hover{opacity:1;}

</style>
</head>

<body>

<div class="top-bar">
    <button onclick="toggleMode()">🌗 Mode</button>
    <button onclick="toggleMusic()">🎵 Music</button>
</div>

<div class="bg" id="bg"></div>

<div class="container">

    <!-- YOU -->
    <div class="card">
        <div class="header"></div>
        <img src="https://files.catbox.moe/gpncs4.jpg" onclick="openImg(this.src)">
        <h2>Rayen</h2>
        <p>My heart sees only one direction: love.</p>
        <div class="badge">Forever Mine ❤</div>
    </div>

    <!-- CENTER -->
    <div class="center">
        <div class="heart" onclick="heartClick(event)">❤</div>
        <h1>Alma</h1>
        <p>Two Hearts • One Vision</p>
    </div>

    <!-- HER -->
    <div class="card">
        <div class="header"></div>
        <img src="https://files.catbox.moe/kwlmq4.jpg" onclick="openImg(this.src)">
        <h2>Alma</h2>
        <p>The light that makes my world visible.</p>
        <div class="badge">Soul Mate ✨</div>
    </div>

</div>

<!-- LOVE MESSAGES -->
<div class="section">

    <h2>💌 Love Messages</h2>

    <div class="box">
        <input id="title" placeholder="Title">
        <textarea id="text" placeholder="Write love message..."></textarea>
        <button onclick="addMsg()">Add ❤</button>
    </div>

    <div id="messages"></div>

</div>

<!-- MODAL -->
<div class="modal" id="modal" onclick="closeImg()">
    <img id="modalImg">
</div>

<script>

/* BG */
const bg=document.getElementById("bg");

for(let i=0;i<120;i++){
    let s=document.createElement("span");
    s.style.left=Math.random()*100+"%";
    s.style.animationDuration=(Math.random()*8+4)+"s";
    bg.appendChild(s);
}

/* MODE */
function toggleMode(){
    document.body.classList.toggle("light");
}

/* MUSIC */
let music=new Audio("https://files.catbox.moe/vfkb97.mp3");
music.loop=true;
let play=false;

function toggleMusic(){
    play=!play;
    play ? music.play() : music.pause();
}

/* IMAGE */
function openImg(src){
    document.getElementById("modal").style.display="flex";
    document.getElementById("modalImg").src=src;
}

function closeImg(){
    document.getElementById("modal").style.display="none";
}

/* HEART */
function heartClick(e){
    let h=document.createElement("div");
    h.className="heart-float";
    h.innerHTML="❤";
    h.style.left=e.clientX+"px";
    h.style.top=e.clientY+"px";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),1000);
}

/* MESSAGES */
function addMsg(){

    let title=document.getElementById("title").value;
    let text=document.getElementById("text").value;

    if(!text) return;

    let div=document.createElement("div");
    div.className="msg";

    div.innerHTML=`
        <b>${title}</b><br><br>${text}
        <span class="copy" onclick="copyText(this)">copy</span>
    `;

    document.getElementById("messages").prepend(div);
}

function copyText(el){
    let text=el.parentElement.innerText;
    navigator.clipboard.writeText(text);
    alert("Copied ❤");
}

</script>

</body>
</html>
