<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Love Vision Pro+ 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{

font-family:'Poppins',sans-serif;

min-height:100vh;

overflow-x:hidden;

display:flex;
justify-content:flex-start;
align-items:center;
flex-direction:column;

color:white;

background:
radial-gradient(circle at top,#ff006e,#0a0015 60%,#000);

padding-bottom:50px;

transition:.4s;
}

/* LIGHT MODE */

body.light{

background:
radial-gradient(circle at top,#ffd1e8,#fff 60%,#f7f7f7);

color:#111;
}

/* BACKGROUND */

.bg{

position:fixed;
inset:0;

z-index:0;
overflow:hidden;
}

.bg span{

position:absolute;

width:3px;
height:3px;

background:white;

border-radius:50%;

animation:float linear infinite;

opacity:.7;
}

@keyframes float{

from{

transform:translateY(100vh);

}

to{

transform:translateY(-100vh);

}

}

/* BUTTONS */

.top-bar{

position:fixed;

top:15px;
right:15px;

z-index:20;

display:flex;
gap:10px;
}

button{

padding:10px 15px;

border:none;

border-radius:15px;

cursor:pointer;

font-weight:600;

background:
linear-gradient(45deg,#ff006e,#8338ec);

color:white;

transition:.3s;

box-shadow:
0 0 20px rgba(255,0,110,.4);
}

button:hover{

transform:scale(1.05);
}

button:active{

transform:scale(.95);
}

/* MAIN */

.container{

position:relative;

z-index:5;

display:flex;

gap:60px;

flex-wrap:wrap;

justify-content:center;
align-items:center;

margin-top:120px;

width:100%;
}

/* CARD */

.card{

position:relative;

width:320px;
height:430px;

border-radius:30px;

background:
rgba(255,255,255,0.06);

backdrop-filter:blur(20px);

border:
1px solid rgba(255,255,255,0.15);

text-align:center;

overflow:hidden;

transition:.4s;

box-shadow:
0 0 30px rgba(255,0,110,.15);
}

.card::before{

content:"";

position:absolute;

top:-100%;
left:-100%;

width:200%;
height:200%;

background:
linear-gradient(
120deg,
transparent,
rgba(255,255,255,.12),
transparent
);

transform:rotate(25deg);

transition:.8s;
}

.card:hover::before{

top:100%;
left:100%;
}

.card:hover{

transform:
translateY(-10px)
scale(1.02);

box-shadow:
0 0 40px rgba(255,0,110,.4);
}

.header{

height:150px;

background:
linear-gradient(135deg,#ff006e,#8338ec);
}

.card img{

width:150px;
height:150px;

border-radius:50%;

object-fit:cover;

margin-top:-75px;

border:
5px solid rgba(255,255,255,.3);

cursor:pointer;

transition:.4s;
}

.card img:hover{

transform:scale(1.07);
}

.card h2{

margin-top:15px;

font-size:28px;
}

.card p{

font-size:14px;

opacity:.85;

margin-top:10px;

padding:0 15px;
}

.badge{

display:inline-block;

margin-top:15px;

padding:10px 20px;

border-radius:30px;

background:
linear-gradient(45deg,#ff006e,#ff4da6);

box-shadow:
0 0 20px rgba(255,0,110,.5);
}

/* CENTER */

.center{
text-align:center;
}

.center .heart{

font-size:130px;

animation:pulse 1.5s infinite;

text-shadow:
0 0 40px #ff2d75;

cursor:pointer;

user-select:none;
}

@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.25);
}

100%{
transform:scale(1);
}

}

.center h1{

font-family:'Great Vibes',cursive;

font-size:60px;

color:#ff9ad5;

animation:
glowText 2s infinite alternate;
}

@keyframes glowText{

from{

text-shadow:
0 0 20px rgba(255,0,110,.4);

}

to{

text-shadow:
0 0 40px rgba(255,0,110,.9);

}

}

/* MODAL */

.modal{

position:fixed;

inset:0;

background:
rgba(0,0,0,.9);

display:none;

justify-content:center;
align-items:center;

z-index:50;
}

.modal img{

width:80%;
max-width:420px;

border-radius:20px;

box-shadow:
0 0 40px rgba(255,255,255,.3);

animation:
zoomIn .3s ease;
}

@keyframes zoomIn{

from{

transform:scale(.7);

opacity:0;
}

to{

transform:scale(1);

opacity:1;
}

}

/* HEART EFFECT */

.heart-float{

position:absolute;

font-size:20px;

animation:up 1s linear forwards;

pointer-events:none;
}

.hand-float{

position:fixed;

font-size:30px;

pointer-events:none;

animation:handUp 1s linear forwards;

z-index:999;
}

.particle{

position:fixed;

width:5px;
height:5px;

border-radius:50%;

background:
rgba(255,255,255,.8);

pointer-events:none;

animation:
particleFloat 2s linear forwards;
}

@keyframes particleFloat{

0%{

opacity:1;

transform:
translateY(0)
scale(1);
}

100%{

opacity:0;

transform:
translateY(-200px)
scale(0);
}

}

@keyframes handUp{

0%{

opacity:1;

transform:
translateY(0)
scale(1);
}

100%{

opacity:0;

transform:
translateY(-140px)
scale(1.5);
}

}

@keyframes up{

from{

transform:translateY(0);

opacity:1;
}

to{

transform:translateY(-120px);

opacity:0;
}

}

/* LOVE MESSAGES */

.section{

width:90%;

max-width:900px;

margin-top:60px;

position:relative;

z-index:5;

text-align:center;
}

.section h2{

margin-bottom:20px;

font-size:35px;
}

.box{

background:
rgba(255,255,255,0.06);

backdrop-filter:blur(15px);

padding:20px;

border-radius:25px;

border:
1px solid rgba(255,255,255,.1);
}

input,
textarea{

width:100%;

padding:15px;

margin-top:10px;

border:none;

border-radius:15px;

background:
rgba(255,255,255,0.1);

color:white;

outline:none;

font-size:15px;

transition:.3s;
}

input:focus,
textarea:focus{

box-shadow:
0 0 20px rgba(255,0,110,.35);
}

body.light input,
body.light textarea{

color:#111;

background:
rgba(0,0,0,.05);
}

textarea{

height:100px;

resize:none;
}

.msg{

margin-top:20px;

padding:20px;

border-radius:20px;

background:
rgba(255,255,255,0.08);

border-left:
4px solid #ff006e;

text-align:left;

position:relative;

animation:show .4s ease;

will-change:transform;

transition:.3s;

transform-origin:center;
}

.msg:hover{

transform:
translateY(-5px)
scale(1.01);

box-shadow:
0 0 25px rgba(255,0,110,.25);
}

@keyframes show{

from{

opacity:0;

transform:translateY(20px);
}

to{

opacity:1;

transform:translateY(0);
}

}

.copy{

position:absolute;

right:15px;
top:15px;

font-size:12px;

cursor:pointer;

opacity:.7;
}

.copy:hover{

opacity:1;
}

/* MOBILE */

@media(max-width:900px){

.container{

flex-direction:column;

gap:30px;
}

.center .heart{

font-size:100px;
}

.center h1{

font-size:50px;
}

}

</style>

</head>

<body>

<!-- TOP BUTTONS -->

<div class="top-bar">

<button onclick="toggleMode()">
🌗 Mode
</button>

<button onclick="toggleMusic()">
🎵 Music
</button>

</div>

<!-- BACKGROUND -->

<div class="bg" id="bg"></div>

<!-- MAIN -->

<div class="container">

<!-- YOU -->

<div class="card">

<div class="header"></div>

<img
src="https://files.catbox.moe/f7x9f6.jpg"
onclick="openImg(this.src)"
>

<h2>Rayen</h2>

<p>
My heart sees only one direction:
love.
</p>

<div class="badge">
Forever Mine ❤
</div>

</div>

<!-- CENTER -->

<div class="center">

<div
class="heart"
onclick="heartClick(event)"
>
❤
</div>

<h1>Alma</h1>

<p>
Two Hearts • One Vision
</p>

</div>

<!-- HER -->

<div class="card">

<div class="header"></div>

<img
src="https://files.catbox.moe/xvqhco.jpg"
onclick="openImg(this.src)"
>

<h2>Alma</h2>

<p>
The light that makes my world visible.
</p>

<div class="badge">
Soul Mate ✨
</div>

</div>

</div>

<!-- LOVE MESSAGES -->

<div class="section">

<h2>
💌 Love Messages
</h2>

<div class="box">

<input
id="title"
placeholder="Message title..."
>

<textarea
id="text"
placeholder="Write your love message here..."
></textarea>

<button onclick="addMsg()">
Add ❤️
</button>

</div>

<div id="messages"></div>

</div>

<!-- MODAL -->

<div
class="modal"
id="modal"
onclick="closeImg()"
>

<img id="modalImg">

</div>

<script type="module">

/* =========================
SUPABASE
========================= */

import { createClient }

from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabaseUrl =
"https://vjsphepnycchogektxcq.supabase.co";

const supabaseKey =
"sb_publishable_TzMnSWGJWmQF190_x9Fxfg_2tbr1gnX";

const supabase =
createClient(
supabaseUrl,
supabaseKey
);

/* =========================
BACKGROUND
========================= */

const bg=
document.getElementById("bg");

for(let i=0;i<120;i++){

let s=
document.createElement("span");

s.style.left=
Math.random()*100+"%";

s.style.animationDuration=
(Math.random()*8+4)+"s";

s.style.opacity=
Math.random();

bg.appendChild(s);

}

/* =========================
MODE
========================= */

function toggleMode(){

document.body.classList.toggle("light");

localStorage.setItem(
"theme",

document.body.classList
.contains("light")

? "light"

: "dark"
);

}

if(
localStorage.getItem("theme")
==="light"
){

document.body
.classList.add("light");

}

window.toggleMode=
toggleMode;

/* =========================
MUSIC
========================= */

let music=
new Audio(
"https://files.catbox.moe/lhfn3i.mp3"
);

music.loop=true;

let play=false;

function toggleMusic(){

play=!play;

play
? music.play()
: music.pause();

}

window.toggleMusic=
toggleMusic;

/* =========================
IMAGE VIEW
========================= */

function openImg(src){

document
.getElementById("modal")
.style.display="flex";

document
.getElementById("modalImg")
.src=src;

}

window.openImg=
openImg;

function closeImg(){

document
.getElementById("modal")
.style.display="none";

}

window.closeImg=
closeImg;

/* =========================
HEART EFFECT
========================= */

function heartClick(e){

/* HEART */

let h=
document.createElement("div");

h.className=
"heart-float";

h.innerHTML="❤";

h.style.left=
e.clientX+"px";

h.style.top=
e.clientY+"px";

document.body
.appendChild(h);

/* HAND */

let hand=
document.createElement("div");

hand.className=
"hand-float";

hand.innerHTML="🫶";

hand.style.left=
(e.clientX-10)+"px";

hand.style.top=
(e.clientY-10)+"px";

document.body
.appendChild(hand);

/* PARTICLES */

for(let i=0;i<8;i++){

let p=
document.createElement("div");

p.className=
"particle";

p.style.left=
e.clientX+"px";

p.style.top=
e.clientY+"px";

document.body
.appendChild(p);

setTimeout(()=>{

p.remove();

},2000);

}

/* REMOVE */

setTimeout(()=>{

h.remove();

hand.remove();

},1000);

}

window.heartClick=
heartClick;

/* =========================
COPY
========================= */

function copyText(text){

navigator.clipboard
.writeText(text);

alert("Copied ❤");

}

window.copyText=
copyText;

/* =========================
LOAD MESSAGES
========================= */

async function loadMessages(){

const { data,error } =

await supabase
.from("messages")
.select("*")
.order("id",{ ascending:false });

if(error){

console.log(error);

return;
}

const messagesDiv=
document.getElementById("messages");

messagesDiv.innerHTML="";

const fragment=
document.createDocumentFragment();

data.forEach((msg)=>{

let div=
document.createElement("div");

div.className=
"msg";

div.innerHTML=`

<b>

${msg.title || "Love Message"}

</b>

<br><br>

${msg.text}

<span
class="copy"

onclick='copyText(
${JSON.stringify(msg.text)}
)'
>

copy

</span>

`;

fragment.appendChild(div);

});

messagesDiv
.appendChild(fragment);

}

/* =========================
ADD MESSAGE
========================= */

let sending=false;

const sendSound =
new Audio(
"https://files.catbox.moe/lhfn3i.mp3"
);

async function addMsg(){

if(sending) return;

let title=
document
.getElementById("title")
.value
.trim();

let text=
document
.getElementById("text")
.value
.trim();

if(!text) return;

sending=true;

/* CHECK DUPLICATE */

const { data } =
await supabase
.from("messages")
.select("*")
.eq("text",text);

if(data.length){

alert(
"Message already exists ❤"
);

sending=false;

return;
}

/* INSERT */

await supabase
.from("messages")
.insert([

{

title:title,

text:text

}

]);

sendSound.play();

document
.getElementById("title")
.value="";

document
.getElementById("text")
.value="";

sending=false;

}

window.addMsg=
addMsg;

/* =========================
REALTIME
========================= */

supabase
.channel('messages-channel')

.on(
'postgres_changes',

{

event:'*',

schema:'public',

table:'messages'

},

(payload)=>{

loadMessages();

}

)

.subscribe();

/* LOAD */

loadMessages();

</script>

</body>
</html>
