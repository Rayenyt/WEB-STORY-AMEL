<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Love Vision Ultra Pro 💖</title>

<link
href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet"
>

<style>

/* =========================
RESET
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{

font-family:'Poppins',sans-serif;

min-height:100vh;

overflow-x:hidden;

display:flex;
flex-direction:column;
align-items:center;

background:
radial-gradient(circle at top,#ff006e,#120018 60%,#000);

color:white;

padding-bottom:80px;

transition:.4s;
}

/* =========================
LIGHT MODE
========================= */

body.light{

background:
radial-gradient(circle at top,#ffd6eb,#ffffff 60%,#f5f5f5);

color:#111;
}

/* =========================
BACKGROUND
========================= */

.bg{

position:fixed;
inset:0;

overflow:hidden;

z-index:0;
}

.bg span{

position:absolute;

width:4px;
height:4px;

background:white;

border-radius:50%;

opacity:.8;

animation:float linear infinite;
}

@keyframes float{

from{
transform:translateY(100vh);
}

to{
transform:translateY(-100vh);
}

}

/* =========================
TOP BAR
========================= */

.top-bar{

position:fixed;

top:15px;
right:15px;

display:flex;
gap:10px;

z-index:50;
}

button{

padding:12px 18px;

border:none;

border-radius:15px;

cursor:pointer;

font-weight:600;

background:
linear-gradient(45deg,#ff006e,#8338ec);

color:white;

transition:.3s;

box-shadow:
0 0 20px rgba(255,0,110,.4);
}

button:hover{

transform:scale(1.05);
}

button:active{

transform:scale(.95);
}

.delete-btn{

background:
linear-gradient(45deg,#ff1744,#b00020);
}

/* =========================
MAIN
========================= */

.container{

position:relative;

z-index:5;

display:flex;

justify-content:center;
align-items:center;

flex-wrap:wrap;

gap:60px;

margin-top:120px;

width:100%;
}

/* =========================
CARD
========================= */

.card{

position:relative;

width:320px;
height:430px;

border-radius:30px;

overflow:hidden;

background:
rgba(255,255,255,0.06);

backdrop-filter:blur(18px);

border:
1px solid rgba(255,255,255,.12);

text-align:center;

transition:.4s;

box-shadow:
0 0 35px rgba(255,0,110,.15);
}

.card::before{

content:"";

position:absolute;

top:-100%;
left:-100%;

width:200%;
height:200%;

background:
linear-gradient(
120deg,
transparent,
rgba(255,255,255,.15),
transparent
);

transform:rotate(25deg);

transition:.8s;
}

.card:hover::before{

top:100%;
left:100%;
}

.card:hover{

transform:
translateY(-10px)
scale(1.02);

box-shadow:
0 0 40px rgba(255,0,110,.45);
}

.header{

height:150px;

background:
linear-gradient(135deg,#ff006e,#8338ec);
}

.card img{

width:150px;
height:150px;

border-radius:50%;

object-fit:cover;

margin-top:-75px;

border:
5px solid rgba(255,255,255,.25);

cursor:pointer;

transition:.4s;
}

.card img:hover{

transform:scale(1.08);
}

.card h2{

margin-top:15px;

font-size:30px;
}

.card p{

padding:0 20px;

margin-top:12px;

font-size:14px;

opacity:.9;
}

.badge{

display:inline-block;

margin-top:18px;

padding:10px 20px;

border-radius:30px;

background:
linear-gradient(45deg,#ff006e,#ff4da6);

box-shadow:
0 0 20px rgba(255,0,110,.4);
}

/* =========================
CENTER
========================= */

.center{
text-align:center;
}

.heart{

font-size:130px;

cursor:pointer;

animation:pulse 1.5s infinite;

text-shadow:
0 0 40px #ff2d75;
}

@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.2);
}

100%{
transform:scale(1);
}

}

.center h1{

font-family:'Great Vibes',cursive;

font-size:70px;

color:#ff9ad5;

animation:glow 2s infinite alternate;
}

@keyframes glow{

from{
text-shadow:0 0 20px rgba(255,0,110,.4);
}

to{
text-shadow:0 0 40px rgba(255,0,110,.9);
}

}

/* =========================
SECTION
========================= */

.section{

width:90%;

max-width:900px;

margin-top:60px;

position:relative;

z-index:5;
}

.section h2{

text-align:center;

font-size:38px;

margin-bottom:20px;
}

.box{

background:
rgba(255,255,255,0.06);

backdrop-filter:blur(15px);

padding:25px;

border-radius:25px;

border:
1px solid rgba(255,255,255,.1);
}

/* =========================
INPUTS
========================= */

input,
textarea,
select{

width:100%;

padding:15px;

margin-top:12px;

border:none;

border-radius:15px;

background:
rgba(255,255,255,.08);

color:white;

font-size:15px;

outline:none;

transition:.3s;
}

input:focus,
textarea:focus,
select:focus{

box-shadow:
0 0 20px rgba(255,0,110,.35);
}

body.light input,
body.light textarea,
body.light select{

background:
rgba(0,0,0,.05);

color:#111;
}

textarea{

height:120px;

resize:none;
}

/* =========================
MESSAGES
========================= */

.msg{

margin-top:20px;

padding:20px;

border-radius:20px;

position:relative;

animation:show .4s ease;

transition:.3s;
}

.msg:hover{

transform:
translateY(-5px)
scale(1.01);

box-shadow:
0 0 25px rgba(255,0,110,.2);
}

@keyframes show{

from{
opacity:0;
transform:translateY(20px);
}

to{
opacity:1;
transform:translateY(0);
}

}

/* USER COLORS */

.msg[data-style="pink"]{

background:
rgba(255,0,110,.08);

border-left:4px solid #ff006e;
}

.msg[data-style="blue"]{

background:
rgba(0,180,255,.08);

border-left:4px solid #00b4ff;
}

.msg[data-style="purple"]{

background:
rgba(131,56,236,.08);

border-left:4px solid #8338ec;
}

.msg[data-style="gold"]{

background:
rgba(255,215,0,.08);

border-left:4px solid gold;
}

.user-tag{

display:inline-block;

padding:6px 12px;

border-radius:20px;

font-size:12px;

margin-bottom:12px;

font-weight:600;
}

.user-pink{
background:#ff006e;
}

.user-blue{
background:#00b4ff;
}

.user-purple{
background:#8338ec;
}

.user-gold{

background:#ffcc00;

color:#111;
}

/* ACTIONS */

.msg-actions{

display:flex;

gap:12px;

margin-top:18px;
}

.copy,
.delete-one{

padding:8px 14px;

border-radius:12px;

font-size:12px;

cursor:pointer;

transition:.3s;
}

.copy{

background:
linear-gradient(45deg,#8338ec,#5a189a);
}

.delete-one{

background:
linear-gradient(45deg,#ff1744,#b00020);
}

.copy:hover,
.delete-one:hover{

transform:scale(1.05);
}

/* =========================
MODAL
========================= */

.modal{

position:fixed;

inset:0;

background:
rgba(0,0,0,.9);

display:none;

justify-content:center;
align-items:center;

z-index:100;
}

.modal img{

width:80%;

max-width:420px;

border-radius:20px;

box-shadow:
0 0 40px rgba(255,255,255,.3);
}

/* =========================
SCROLLBAR
========================= */

::-webkit-scrollbar{
width:10px;
}

::-webkit-scrollbar-thumb{

background:
linear-gradient(#ff006e,#8338ec);

border-radius:20px;
}

::-webkit-scrollbar-track{

background:
rgba(255,255,255,.05);
}

/* =========================
RESPONSIVE
========================= */

@media(max-width:900px){

.container{

flex-direction:column;

gap:35px;
}

.heart{
font-size:100px;
}

.center h1{
font-size:55px;
}

}

</style>

</head>

<body>

<!-- TOP BUTTONS -->

<div class="top-bar">

<button onclick="toggleMode()">
🌗 Mode
</button>

<button onclick="toggleMusic()">
🎵 Music
</button>

</div>

<!-- BACKGROUND -->

<div class="bg" id="bg"></div>

<!-- MAIN -->

<div class="container">

<!-- USER -->

<div class="card">

<div class="header"></div>

<img
src="https://files.catbox.moe/f7x9f6.jpg"
onclick="openImg(this.src)"
>

<h2>Rayen</h2>

<p>
My heart sees only one direction:
love forever.
</p>

<div class="badge">
Forever Mine ❤
</div>

</div>

<!-- CENTER -->

<div class="center">

<div
class="heart"
onclick="heartClick(event)"
>
❤
</div>

<h1>Alma</h1>

<p>
Two Hearts • One Vision
</p>

</div>

<!-- HER -->

<div class="card">

<div class="header"></div>

<img
src="https://files.catbox.moe/xvqhco.jpg"
onclick="openImg(this.src)"
>

<h2>Alma</h2>

<p>
The light that makes my world beautiful.
</p>

<div class="badge">
Soul Mate ✨
</div>

</div>

</div>

<!-- MESSAGE SECTION -->

<div class="section">

<h2>
💌 Love Messages
</h2>

<div class="box">

<input
id="username"
placeholder="Your name..."
>

<input
id="title"
placeholder="Message title..."
>

<select id="styleSelect">

<option value="pink">
💖 Pink Style
</option>

<option value="blue">
💙 Blue Style
</option>

<option value="purple">
💜 Purple Style
</option>

<option value="gold">
✨ Gold Style
</option>

</select>

<textarea
id="text"
placeholder="Write your love message here..."
></textarea>

<button onclick="addMsg()">
Add ❤️
</button>

<button
onclick="deleteAllMsgs()"
class="delete-btn"
>
🗑 Delete All
</button>

</div>

<div id="messages"></div>

</div>

<!-- MODAL -->

<div
class="modal"
id="modal"
onclick="closeImg()"
>

<img id="modalImg">

</div>

<script type="module">

/* =========================
SUPABASE
========================= */

import { createClient }

from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabaseUrl =
"https://vjsphepnycchogektxcq.supabase.co";

const supabaseKey =
"YOUR_SUPABASE_KEY";

const supabase =
createClient(
supabaseUrl,
supabaseKey
);

/* =========================
BACKGROUND
========================= */

const bg =
document.getElementById("bg");

for(let i=0;i<140;i++){

let s =
document.createElement("span");

s.style.left =
Math.random()*100+"%";

s.style.animationDuration =
(Math.random()*8+4)+"s";

s.style.opacity =
Math.random();

bg.appendChild(s);

}

/* =========================
MODE
========================= */

function toggleMode(){

document.body.classList.toggle("light");

localStorage.setItem(
"theme",

document.body.classList
.contains("light")

? "light"

: "dark"
);

}

if(
localStorage.getItem("theme")
==="light"
){

document.body
.classList.add("light");

}

window.toggleMode =
toggleMode;

/* =========================
MUSIC
========================= */

let music =
new Audio(
"https://files.catbox.moe/lhfn3i.mp3"
);

music.loop = true;

let play = false;

function toggleMusic(){

play = !play;

play
? music.play()
: music.pause();

}

window.toggleMusic =
toggleMusic;

/* =========================
IMAGE VIEW
========================= */

function openImg(src){

document
.getElementById("modal")
.style.display = "flex";

document
.getElementById("modalImg")
.src = src;

}

window.openImg =
openImg;

function closeImg(){

document
.getElementById("modal")
.style.display = "none";

}

window.closeImg =
closeImg;

/* =========================
HEART EFFECT
========================= */

function heartClick(e){

for(let i=0;i<10;i++){

let heart =
document.createElement("div");

heart.innerHTML = "❤";

heart.style.position = "fixed";

heart.style.left =
e.clientX + "px";

heart.style.top =
e.clientY + "px";

heart.style.fontSize =
(Math.random()*20+15)+"px";

heart.style.pointerEvents = "none";

heart.style.zIndex = "999";

heart.style.transition = "1s";

document.body.appendChild(heart);

setTimeout(()=>{

heart.style.transform =
`translate(
${(Math.random()-0.5)*250}px,
-${Math.random()*250}px
)
scale(0)`;

heart.style.opacity = "0";

},10);

setTimeout(()=>{
heart.remove();
},1000);

}

}

window.heartClick =
heartClick;

/* =========================
COPY
========================= */

function copyText(text){

navigator.clipboard
.writeText(text);

alert("Copied ❤");

}

window.copyText =
copyText;

/* =========================
LOAD MESSAGES
========================= */

async function loadMessages(){

const { data,error } =

await supabase
.from("messages")
.select("*")
.order("id",{ ascending:false });

if(error){

console.log(error);

return;
}

const messagesDiv =
document.getElementById("messages");

messagesDiv.innerHTML = "";

const fragment =
document.createDocumentFragment();

data.forEach((msg)=>{

let div =
document.createElement("div");

div.className =
"msg";

div.setAttribute(
"data-style",
msg.style || "pink"
);

div.innerHTML = `

<div class="user-tag user-${msg.style || "pink"}">

${msg.username || "Anonymous"}

</div>

<b>

${msg.title || "Love Message"}

</b>

<br><br>

${msg.text}

<div class="msg-actions">

<span
class="copy"

onclick='copyText(
${JSON.stringify(msg.text)}
)'
>

📋 Copy

</span>

<span
class="delete-one"

onclick="deleteMessage(${msg.id})"
>

🗑 Delete

</span>

</div>

`;

fragment.appendChild(div);

});

messagesDiv
.appendChild(fragment);

}

/* =========================
ADD MESSAGE
========================= */

let sending = false;

async function addMsg(){

if(sending) return;

let username =
document
.getElementById("username")
.value
.trim();

let title =
document
.getElementById("title")
.value
.trim();

let text =
document
.getElementById("text")
.value
.trim();

let style =
document
.getElementById("styleSelect")
.value;

if(!username){

alert("Enter your name ❤");

return;
}

if(!text){

alert("Write a message ❤");

return;
}

sending = true;

/* DUPLICATE CHECK */

const { data } =

await supabase
.from("messages")
.select("*")
.eq("text",text);

if(data.length){

alert(
"Message already exists ❤"
);

sending = false;

return;
}

/* INSERT */

await supabase
.from("messages")
.insert([

{

username:username,

title:title,

text:text,

style:style

}

]);

document
.getElementById("username")
.value = "";

document
.getElementById("title")
.value = "";

document
.getElementById("text")
.value = "";

sending = false;

}

window.addMsg =
addMsg;

/* =========================
DELETE ONE
========================= */

async function deleteMessage(id){

let ask =
confirm(
"Delete this message?"
);

if(!ask) return;

await supabase
.from("messages")
.delete()
.eq("id",id);

loadMessages();

}

window.deleteMessage =
deleteMessage;

/* =========================
DELETE ALL
========================= */

async function deleteAllMsgs(){

let ask =
confirm(
"Delete all messages?"
);

if(!ask) return;

await supabase
.from("messages")
.delete()
.neq("id",0);

loadMessages();

}

window.deleteAllMsgs =
deleteAllMsgs;

/* =========================
REALTIME
========================= */

supabase
.channel('messages-channel')

.on(

'postgres_changes',

{

event:'*',

schema:'public',

table:'messages'

},

(payload)=>{

loadMessages();

}

)

.subscribe();

/* =========================
LOAD
========================= */

loadMessages();

</script>

</body>

</html>
