<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Love Vision Pro+ 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
min-height:100vh;
overflow-x:hidden;
display:flex;
flex-direction:column;
align-items:center;
color:white;

background:
radial-gradient(circle at top,#ff006e,#0a0015 60%,#000);

padding-bottom:80px;
transition:.4s;
}

body.light{

background:
radial-gradient(circle at top,#ffd1e8,#fff 60%,#f5f5f5);

color:#111;
}

/* BACKGROUND */

.bg{
position:fixed;
inset:0;
z-index:0;
overflow:hidden;
}

.bg span{
position:absolute;
width:3px;
height:3px;
background:white;
border-radius:50%;
animation:float linear infinite;
opacity:.7;
}

@keyframes float{

from{
transform:translateY(100vh);
}

to{
transform:translateY(-100vh);
}

}

/* TOP BAR */

.top-bar{

position:fixed;
top:15px;
right:15px;

display:flex;
gap:10px;

z-index:20;
}

button{

padding:12px 18px;
border:none;
border-radius:15px;
cursor:pointer;

font-weight:600;

background:
linear-gradient(45deg,#ff006e,#8338ec);

color:white;

transition:.3s;

box-shadow:
0 0 20px rgba(255,0,110,.4);
}

button:hover{
transform:scale(1.05);
}

/* CONTAINER */

.container{

position:relative;
z-index:5;

display:flex;
gap:60px;

flex-wrap:wrap;

justify-content:center;
align-items:center;

margin-top:120px;
width:100%;
}

/* CARD */

.card{

width:320px;
height:430px;

border-radius:30px;

background:
linear-gradient(
145deg,
rgba(255,255,255,0.12),
rgba(255,255,255,0.03)
);

backdrop-filter:blur(20px);

border:
1px solid rgba(255,255,255,0.15);

overflow:hidden;

text-align:center;

transition:.4s;

box-shadow:
0 0 30px rgba(255,0,110,.15);
}

.card:hover{

transform:
translateY(-10px)
scale(1.02);

box-shadow:
0 0 40px rgba(255,0,110,.4);
}

.header{

height:150px;

background:
linear-gradient(135deg,#ff006e,#8338ec);
}

.card img{

width:150px;
height:150px;

object-fit:cover;

border-radius:50%;

margin-top:-75px;

border:
5px solid rgba(255,255,255,.3);

cursor:pointer;

transition:.4s;
}

.card img:hover{
transform:scale(1.07);
}

.card h2{

margin-top:15px;
font-size:28px;
}

.card p{

font-size:14px;
opacity:.85;

margin-top:10px;
padding:0 15px;
}

.badge{

display:inline-block;

margin-top:15px;
padding:10px 20px;

border-radius:30px;

background:
linear-gradient(45deg,#ff006e,#ff4da6);

box-shadow:
0 0 20px rgba(255,0,110,.5);
}

/* CENTER */

.center{
text-align:center;
}

.center .heart{

font-size:130px;

animation:pulse 1.5s infinite;

text-shadow:
0 0 40px #ff2d75;

cursor:pointer;
user-select:none;
}

@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.25);
}

100%{
transform:scale(1);
}

}

.center h1{

font-family:'Great Vibes',cursive;
font-size:65px;

color:#ff9ad5;

text-shadow:
0 0 20px rgba(255,0,110,.5);
}

/* SECTION */

.section{

width:90%;
max-width:900px;

margin-top:60px;

position:relative;
z-index:5;
}

.section h2{

text-align:center;
margin-bottom:20px;

font-size:35px;
}

/* BOX */

.box{

background:
rgba(255,255,255,0.06);

backdrop-filter:blur(15px);

padding:20px;

border-radius:25px;

border:
1px solid rgba(255,255,255,.1);
}

input,
textarea{

width:100%;

padding:15px;

margin-top:10px;

border:none;
outline:none;

border-radius:15px;

font-size:15px;

background:
rgba(255,255,255,.1);

color:white;
}

body.light input,
body.light textarea{

background:
rgba(0,0,0,.05);

color:#111;
}

textarea{

height:110px;
resize:none;
}

/* MESSAGES */

.msg{

margin-top:20px;

padding:20px;

border-radius:20px;

background:
rgba(255,255,255,0.08);

border-left:
4px solid #ff006e;

position:relative;

animation:pop .5s ease;
}

@keyframes pop{

0%{
opacity:0;
transform:scale(.8);
}

100%{
opacity:1;
transform:scale(1);
}

}

.copy{

position:absolute;
top:15px;
right:15px;

font-size:12px;

cursor:pointer;
opacity:.7;
}

.copy:hover{
opacity:1;
}

.date{

margin-top:15px;
font-size:12px;
opacity:.6;
}

.like-btn{

margin-top:15px;
padding:8px 14px;

font-size:14px;
}

/* MODAL */

.modal{

position:fixed;
inset:0;

background:
rgba(0,0,0,.9);

display:none;

justify-content:center;
align-items:center;

z-index:50;
}

.modal img{

width:80%;
max-width:420px;

border-radius:20px;

box-shadow:
0 0 40px rgba(255,255,255,.3);
}

/* HEART FLOAT */

.heart-float{

position:absolute;

font-size:20px;

animation:up 1s linear forwards;

pointer-events:none;
}

@keyframes up{

from{
transform:translateY(0);
opacity:1;
}

to{
transform:translateY(-120px);
opacity:0;
}

}

/* LOADER */

#loader{

display:none;

margin-top:20px;
text-align:center;

opacity:.7;
}

/* VISITORS */

.visitors{

position:fixed;

left:15px;
top:15px;

z-index:20;

padding:10px 15px;

border-radius:15px;

background:
rgba(255,255,255,.08);

backdrop-filter:blur(10px);
}

/* MOBILE */

@media(max-width:900px){

.container{
flex-direction:column;
gap:30px;
}

.center .heart{
font-size:100px;
}

.center h1{
font-size:50px;
}

}

</style>
</head>

<body>

<div class="bg" id="bg"></div>

<div class="visitors" id="visitorCount">
👀 Loading...
</div>

<div class="top-bar">

<button onclick="toggleMode()">
🌗 Mode
</button>

<button onclick="toggleMusic()">
🎵 Music
</button>

</div>

<div class="container">

<div class="card">

<div class="header"></div>

<img
src="https://files.catbox.moe/f7x9f6.jpg"
onclick="openImg(this.src)"
>

<h2>Rayen</h2>

<p>
My heart sees only one direction:
love.
</p>

<div class="badge">
Forever Mine ❤
</div>

</div>

<div class="center">

<div
class="heart"
onclick="heartClick(event)"
>
❤
</div>

<h1>Alma</h1>

<p>
Two Hearts • One Vision
</p>

</div>

<div class="card">

<div class="header"></div>

<img
src="https://files.catbox.moe/xvqhco.jpg"
onclick="openImg(this.src)"
>

<h2>Alma</h2>

<p>
The light that makes my world visible.
</p>

<div class="badge">
Soul Mate ✨
</div>

</div>

</div>

<div class="section">

<h2>
💌 Love Messages
</h2>

<div class="box">

<input
id="title"
placeholder="Message title..."
>

<textarea
id="text"
placeholder="Write your love message here..."
></textarea>

<button onclick="addMsg(event)">
Add ❤️
</button>

</div>

<div id="loader">
Loading...
</div>

<div id="messages"></div>

</div>

<div
class="modal"
id="modal"
onclick="closeImg()"
>

<img id="modalImg">

</div>

<script type="module">

import { createClient }
from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

/* =========================
SUPABASE
========================= */

const supabaseUrl =
"https://vjsphepnycchogektxcq.supabase.co";

const supabaseKey =
"YOUR_SUPABASE_KEY";

const supabase =
createClient(
supabaseUrl,
supabaseKey
);

/* =========================
BACKGROUND
========================= */

const bg=
document.getElementById("bg");

for(let i=0;i<120;i++){

let s=
document.createElement("span");

s.style.left=
Math.random()*100+"%";

s.style.animationDuration=
(Math.random()*8+4)+"s";

s.style.opacity=
Math.random();

bg.appendChild(s);

}

/* =========================
THEME
========================= */

function toggleMode(){

document.body
.classList.toggle("light");

localStorage.setItem(
"theme",

document.body.classList
.contains("light")

? "light"

: "dark"
);

}

if(
localStorage.getItem("theme")
==="light"
){

document.body
.classList.add("light");

}

window.toggleMode=
toggleMode;

/* =========================
MUSIC
========================= */

let music=
new Audio(
"https://files.catbox.moe/lhfn3i.mp3"
);

music.loop=true;

let play=false;

function toggleMusic(){

play=!play;

play
? music.play()
: music.pause();

}

window.toggleMusic=
toggleMusic;

/* =========================
IMAGE VIEW
========================= */

function openImg(src){

document
.getElementById("modal")
.style.display="flex";

document
.getElementById("modalImg")
.src=src;

}

window.openImg=
openImg;

function closeImg(){

document
.getElementById("modal")
.style.display="none";

}

window.closeImg=
closeImg;

/* =========================
HEART EFFECT
========================= */

function heartClick(e){

let h=
document.createElement("div");

h.className=
"heart-float";

h.innerHTML="❤";

h.style.left=
e.clientX+"px";

h.style.top=
e.clientY+"px";

document.body
.appendChild(h);

setTimeout(()=>{

h.remove();

},1000);

}

window.heartClick=
heartClick;

/* =========================
COPY
========================= */

function copyText(text){

navigator.clipboard
.writeText(text);

alert("Copied ❤");

}

window.copyText=
copyText;

/* =========================
LOAD MESSAGES
========================= */

const loader=
document.getElementById("loader");

async function loadMessages(){

loader.style.display=
"block";

const { data,error } =
await supabase
.from("messages")
.select("*")
.order("id",{
ascending:false
});

loader.style.display=
"none";

if(error){

console.log(error);

return;

}

const messagesDiv=
document.getElementById("messages");

const fragment=
document.createDocumentFragment();

messagesDiv.innerHTML="";

data.forEach((msg)=>{

let div=
document.createElement("div");

div.className=
"msg";

div.innerHTML=
`
<b>
${msg.title || "Love Message"}
</b>

<br><br>

${msg.text}

<span
class="copy"

onclick='copyText(
${JSON.stringify(msg.text)}
)'
>
copy
</span>

<br>

<button
class="like-btn"

onclick="likeMsg(${msg.id})"
>

❤️ ${msg.likes || 0}

</button>

<div class="date">

${new Date(
msg.created_at
).toLocaleString()}

</div>
`;

fragment.appendChild(div);

});

messagesDiv
.appendChild(fragment);

}

/* =========================
ADD MESSAGE
========================= */

let sending=false;

async function addMsg(event){

if(sending) return;

let title=
document
.getElementById("title")
.value
.trim();

let text=
document
.getElementById("text")
.value
.trim();

if(!text) return;

sending=true;

const btn=
event.target;

btn.innerHTML=
"Sending...";

/* CHECK DUPLICATE */

const { data } =
await supabase
.from("messages")
.select("*")
.eq("text",text);

if(data.length){

alert(
"Message already exists ❤"
);

btn.innerHTML=
"Add ❤️";

sending=false;

return;

}

/* INSERT */

await supabase
.from("messages")
.insert([

{
title:
title || "Love Message",

text:text,

likes:0
}

]);

document
.getElementById("title")
.value="";

document
.getElementById("text")
.value="";

btn.innerHTML=
"Add ❤️";

sending=false;

}

/* =========================
LIKE
========================= */

async function likeMsg(id){

const { data } =
await supabase
.from("messages")
.select("likes")
.eq("id",id)
.single();

await supabase
.from("messages")
.update({

likes:
(data.likes || 0)+1

})
.eq("id",id);

}

window.likeMsg=
likeMsg;

/* =========================
REALTIME
========================= */

supabase
.channel('messages-channel')

.on(
'postgres_changes',

{
event:'*',
schema:'public',
table:'messages'
},

(payload)=>{

loadMessages();

}

)

.subscribe();

/* =========================
VISITORS
========================= */

async function updateVisitors(){

let count=
localStorage.getItem(
"visited"
);

if(!count){

localStorage.setItem(
"visited",
"true"
);

const { data } =
await supabase
.from("visitors")
.select("*");

document
.getElementById("visitorCount")
.innerHTML=

"👀 Visitors: "+
data.length;

}else{

const { data } =
await supabase
.from("visitors")
.select("*");

document
.getElementById("visitorCount")
.innerHTML=

"👀 Visitors: "+
data.length;

}

}

updateVisitors();

/* =========================
LOAD
========================= */

loadMessages();

</script>

</body>
</html>
